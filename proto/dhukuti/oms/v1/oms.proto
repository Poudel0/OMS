syntax = "proto3";

package dhukuti.oms.v1;

option go_package = "github.com/Poudel0/OMS/internal/pb;pb";

// OrderService is the venue's public API for one trading node.
//
// Prices and quantities are integers throughout. NEPSE instruments trade in
// discrete price ticks, so a float price would introduce rounding error into
// the one place the system must be exact; see ADR-001.
service OrderService {
  // PlaceOrder submits an order and returns synchronously, once the order is
  // durable and matched. The response carries every trade the order produced.
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);

  // CancelOrder removes a resting order. Cancelling an order that already
  // filled or was already cancelled fails; the venue does not distinguish
  // those cases from an unknown ID.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  // StreamTrades pushes trades for one symbol as they execute. The stream
  // starts from the moment of subscription — it is a live feed, not a
  // replayable history, so it makes no durability guarantee of its own.
  rpc StreamTrades(StreamTradesRequest) returns (stream Trade);

  // GetBookSnapshot returns aggregated depth for one symbol. It is served from
  // inside that symbol's sequencer goroutine, so it is a consistent
  // point-in-time view rather than a torn read of a book being mutated.
  //
  // It exists mainly to compare two nodes: after a failover, "does the promoted
  // node hold the same book the lost one did" needs an answer that does not
  // involve reading files by hand.
  rpc GetBookSnapshot(GetBookSnapshotRequest) returns (GetBookSnapshotResponse);
}

message GetBookSnapshotRequest {
  string symbol = 1;
}

message GetBookSnapshotResponse {
  // depth_json is L2 depth: total resting quantity per price, both sides, as
  // JSON. Aggregated rather than per-order, so it exposes no queue positions.
  string depth_json = 1;

  // log_position is how far this node's log had advanced when the snapshot was
  // taken, which is what makes two nodes' snapshots comparable.
  int64 log_position = 2;
}

// ReplicationService is the primary's side of WAL shipping: a follower streams
// this node's write-ahead log and replays it into its own books, so it can be
// promoted by hand if the primary is lost. See ADR-006.
//
// It is deliberately a separate service from OrderService. A follower is not a
// client, the two have completely different trust and availability stories, and
// keeping them apart means a deployment can expose one without the other.
service ReplicationService {
  // ListSymbols reports the symbols this node has logs for, so a follower can
  // discover what to replicate without being configured with the list.
  rpc ListSymbols(ListSymbolsRequest) returns (ListSymbolsResponse);

  // StreamWAL streams one symbol's log records from a position onward, and
  // keeps streaming as new ones are appended. Records are batched as they
  // become available.
  //
  // One stream per symbol, because the logs are per symbol (ADR-005). That
  // needs no global ordering between symbols and means one lagging symbol
  // cannot stall the others.
  rpc StreamWAL(StreamWALRequest) returns (stream WALBatch);

  // ReportProgress lets a follower tell the primary how far it has applied, so
  // the primary can report replication lag. It is advisory: the primary streams
  // regardless, and a follower that never reports is simply invisible.
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);

  // ReplicationStatus reports what the primary knows about each symbol's lag.
  rpc ReplicationStatus(ReplicationStatusRequest) returns (ReplicationStatusResponse);
}

message ListSymbolsRequest {}

message ListSymbolsResponse {
  repeated string symbols = 1;
}

message StreamWALRequest {
  string symbol = 1;

  // after_position streams records strictly above this log position. A follower
  // sends the highest position it has durably applied, so 0 means "from the
  // beginning" and there is no separate full-copy step -- the log IS the
  // snapshot.
  int64 after_position = 2;
}

// WALRecordKind mirrors the two mutations the log replays.
enum WALRecordKind {
  WAL_RECORD_KIND_UNSPECIFIED = 0;
  WAL_RECORD_KIND_SUBMIT = 1;
  WAL_RECORD_KIND_CANCEL = 2;
}

message WALRecord {
  // position is the record's log position, assigned by the primary. The
  // follower stores records under the primary's positions, never its own:
  // renumbering would make the follower's log a different log and break resume.
  int64 position = 1;
  int64 logged_at_unix_nano = 2;
  WALRecordKind kind = 3;

  // Set when kind is SUBMIT.
  Order order = 4;

  // Set when kind is CANCEL.
  int64 cancel_order_id = 5;
  // cancel_requested_by carries the ownership constraint the cancel was checked
  // against. It has to travel: the follower re-evaluates the constraint, so
  // omitting it would let a cancel that the primary refused succeed on the
  // follower, and the two books would diverge.
  string cancel_requested_by = 6;
}

// Order is an order as the log recorded it, with the venue-assigned id already
// in place.
message Order {
  int64 order_id = 1;
  string symbol = 2;
  string account_id = 3;
  OrderType type = 4;
  int64 price = 5;
  int64 quantity = 6;
  Side side = 7;
  int64 placed_at_unix_nano = 8;
}

message WALBatch {
  repeated WALRecord records = 1;
  // primary_last_position is the highest position the primary had when it sent
  // this batch, so a follower can compute its own lag without a round trip.
  int64 primary_last_position = 2;
}

message ReportProgressRequest {
  string symbol = 1;
  int64 applied_position = 2;
  // applied_at is the logged_at of the record at applied_position, which is what
  // turns a lag in records into a lag in time.
  int64 applied_record_logged_at_unix_nano = 3;
}

message ReportProgressResponse {}

message ReplicationStatusRequest {}

message SymbolLag {
  string symbol = 1;
  int64 primary_position = 2;
  int64 follower_position = 3;
  // records_behind is primary_position - follower_position.
  int64 records_behind = 4;
  // millis_behind is now minus the logged_at of the follower's last applied
  // record. It is 0 when no follower has ever reported.
  int64 millis_behind = 5;
  bool follower_seen = 6;
}

message ReplicationStatusResponse {
  repeated SymbolLag symbols = 1;
}

// Side is the direction of an order. The unspecified zero value is invalid
// rather than defaulting, so a caller that forgets the field is rejected
// instead of silently having its order treated as a buy.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

// OrderType is LIMIT or MARKET. Unspecified is invalid, same reasoning as Side.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

message PlaceOrderRequest {
  // symbol is the instrument, e.g. "NABIL". Uppercase A-Z0-9, max 12 chars.
  string symbol = 1;

  // account_id is the account the order is placed for. Authenticating that
  // the caller is entitled to act for this account is out of scope for v1
  // (see ADR-005) — the field is trusted as sent.
  string account_id = 2;

  Side side = 3;
  OrderType type = 4;

  // price is in ticks and is ignored for MARKET orders.
  int64 price = 5;
  int64 quantity = 6;
}

message PlaceOrderResponse {
  // order_id is assigned by the venue, not the client. A client-supplied ID
  // would let one client claim another's identifier and then cancel its
  // orders.
  int64 order_id = 1;

  // log_position is the order's write-ahead log position, durable before any
  // matching happened. It is not an order ID — cancels get positions too.
  int64 log_position = 2;

  // trades is every execution this order caused, in match order. Empty means
  // the order rested without crossing anything.
  repeated Trade trades = 3;

  // resting_quantity is what remains in the book. A MARKET order's unfilled
  // remainder is dropped rather than rested, so this is always 0 for MARKET.
  int64 resting_quantity = 4;

  // self_prevented_order_ids lists your own resting orders that were cancelled
  // because this order would otherwise have traded with your own account. The
  // venue cancels the resting side rather than printing a wash trade, and says
  // so here — an order silently vanishing from the book would be worse.
  repeated int64 self_prevented_order_ids = 5;
}

message CancelOrderRequest {
  string symbol = 1;
  int64 order_id = 2;

  // account_id must match the account that placed the order. Same v1 caveat
  // as PlaceOrderRequest.account_id: the claim is checked but not
  // authenticated.
  string account_id = 3;
}

message CancelOrderResponse {
  int64 log_position = 1;
}

message StreamTradesRequest {
  string symbol = 1;
}

message Trade {
  // trade_id is unique within a symbol.
  int64 trade_id = 1;
  string symbol = 2;

  // price is always the resting (maker) order's price, never the incoming
  // taker's — the taker crossed a price that was already on offer.
  int64 price = 3;
  int64 quantity = 4;

  int64 maker_order_id = 5;
  int64 taker_order_id = 6;
  string maker_account_id = 7;
  string taker_account_id = 8;

  // executed_at is a metric, not an ordering key. Matching order is
  // determined by log position, and replay does not reproduce this field —
  // see ADR-003.
  int64 executed_at_unix_nano = 9;

  // taker_side is the incoming order's direction, which is what says who
  // bought: on SIDE_BUY the taker pays cash and receives shares. Without it a
  // trade names both parties but not which way value moved.
  Side taker_side = 10;
}
