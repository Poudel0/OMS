name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    # The ledger tests skip themselves when OMS_TEST_DATABASE_URL is unset, so
    # without a database here they would pass silently forever. A service
    # container is what keeps that skip honest.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dhukuti_oms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OMS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dhukuti_oms_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5' }

      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out

      # The generated stubs are committed, so a stale checkout would compile
      # against a proto nobody can reproduce. Regenerate and fail on any diff.
      - name: protoc
        uses: arduino/setup-protoc@v3
        with: { version: '25.3', repo-token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: generated stubs are up to date
        run: |
          make proto
          git diff --exit-code -- internal/pb || {
            echo "internal/pb is stale: run 'make proto' and commit the result" >&2
            exit 1
          }

      - run: go test ./... -race

      # Every test at least once without -race too: the race detector changes
      # scheduling, and a concurrency bug that only appears at native speed
      # would otherwise never be seen.
      - run: go test ./... -count=1
